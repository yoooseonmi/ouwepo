<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>so many boooooooks</title>
    <link rel="stylesheet" href="book.css">

</head>

<body>

<div id="emptySpace" style="height: 10px;"></div>

<div id="content">
    <div id="bookList">
        <ul id="humanity"></ul>

        <ul id="philosophy"></ul>

        <ul id="math"></ul>
    </div>
    <div id="result">book</div>
</div>

<script>
    fetch('./aladin_books.json')
        .then(res => res.json())
        .then(data => {
            console.log(data);
            const math = data['수학'];
            const humanity = data['인문학'];
            const philosophy = data['철학'];

            math.forEach(item => {
                const title = document.createElement("li");
                // const author = document.createElement("li");

                title.textContent = item.title;
                // author.textContent = item.author;

                document.getElementById("math").appendChild(title);
            });

            humanity.forEach(item => {
                const title = document.createElement("li");
                title.textContent = item.title;
                document.getElementById("humanity").appendChild(title);
            });

            philosophy.forEach(item => {
                const title = document.createElement("li");
                title.textContent = item.title;
                document.getElementById("philosophy").appendChild(title);
            });

            // 옵저버 부착
            document.querySelectorAll('#bookList li').forEach(li => {
                observer.observe(li);
            })
        })
        .catch(err => console.error('JSON 불러오기 실패: ', err));

    function scrollReact() {}
    const bookList = document.getElementById("bookList");
    bookList.addEventListener("scroll", () => {
        // console.log("현재 스크롤 위치: ", bookList.scrollTop);
    });

    const emptySpace = document.getElementById('emptySpace');
    const emptySpaceRect = emptySpace.getBoundingClientRect();
    const bookListRect = bookList.getBoundingClientRect();
    const result = document.getElementById("result");

    const offsetFromTop = emptySpaceRect.bottom - bookListRect.top;
    const offsetFromBottom = bookListRect.height - offsetFromTop;

    const observer = new IntersectionObserver(
        (entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) {
                    // console.log("닿음", entry.target.textContent);
                    // const book = document.createElement("span");
                    // book.textContent = entry.target.textContent;
                    //
                    // result.appendChild(book);
                    result.textContent = result.textContent.slice(0,-1) + "o" + result.textContent.slice(-1);
                }
            });
        },
        {
            root: document.querySelector("#bookList"),
            rootMargin: `-${offsetFromTop}px 0px -${offsetFromBottom}px 0px`,
            threshold: 0
        }
    );

    let lastScrollTop = bookList.scrollTop;
    bookList.addEventListener('scroll', () => {
        const currentScrollTop = bookList.scrollTop;
        const direction = currentScrollTop > lastScrollTop ? 'down' : 'up';
        lastScrollTop = currentScrollTop;

        if(direction === 'down') {
            console.log("down");
            document.getElementById("result").style.fontWeight = "400";
            document.getElementById("result").style.color = "cornflowerblue";
        } else {
            console.log("up");
            document.getElementById("result").style.fontWeight = "bold";
            document.getElementById("result").style.color = "black";

        }
    }, { passive: true });

</script>
</body>
</html>
